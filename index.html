<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saudi WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false"
      raycaster="objects: .clickable">
    </a-camera>

    <!-- البطاقة الأولى -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-image
        src="https://dummyimage.com/600x600/ffffff/000000.png&text=OVERLAY+1"
        position="0 0 0"
        width="1"
        height="1">
      </a-image>
    </a-entity>

    <!-- البطاقة الثانية -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-image
        src="https://dummyimage.com/600x600/ffffff/000000.png&text=OVERLAY+2"
        position="0 0 0"
        width="1"
        height="1">
      </a-image>
    </a-entity>

  </a-scene>

</body>
</html>

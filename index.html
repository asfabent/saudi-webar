<!DOCTYPE html>
<html lang="ar">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 1 - الباحة -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-image src="./%D8%A7%D9%84%D8%A8%D8%A7%D8%AD%D8%A9.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 2 - الجوف -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-image src="./الجوف.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 3 - الحدود الشمالية -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-image src="./الحدود الشمالية.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 4 - الرياض -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-image src="./الرياض.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 5 - الشرقية -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-image src="./%D8%A7%D9%84%D8%B4%D8%B1%D9%82%D9%8A%D8%A9.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 6 - القصيم -->
    <a-entity mindar-image-target="targetIndex: 5">
      <a-image src="./القصيم.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 7 - المدينة -->
    <a-entity mindar-image-target="targetIndex: 6">
      <a-image src="./المدينة.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 8 - تبوك -->
    <a-entity mindar-image-target="targetIndex: 7">
      <a-image src="./تبوك.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 9 - جازان -->
    <a-entity mindar-image-target="targetIndex: 8">
      <a-image src="./جازان.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 10 - حائل -->
    <a-entity mindar-image-target="targetIndex: 9">
      <a-image src="./حائل.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 11 - عسير -->
    <a-entity mindar-image-target="targetIndex: 10">
      <a-image src="./عسير.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 12 - مكة -->
    <a-entity mindar-image-target="targetIndex: 11">
      <a-image src="./مكة.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

    <!-- 13 - نجران -->
    <a-entity mindar-image-target="targetIndex: 12">
      <a-image src="./نجران.png"
        position="0 0 0" width="1" height="1"></a-image>
    </a-entity>

  </a-scene>

</body>
</html>

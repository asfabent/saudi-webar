<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-text value="TARGET 1" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-text value="TARGET 2" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-text value="TARGET 3" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-text value="TARGET 4" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-text value="TARGET 5" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 5">
      <a-text value="TARGET 6" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 6">
      <a-text value="TARGET 7" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 7">
      <a-text value="TARGET 8" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 8">

    </a-entity>

    <a-entity mindar-image-target="targetIndex: 9">

    <a-entity mindar-image-target="targetIndex: 10">

    </a-entity>

    <a-entity mindar-image-target="targetIndex: 11">
      <a-text value="TARGET 12" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 12">
      <a-text value="TARGET 13" align="center" color="red"
        position="0 0 0" width="2" height="2">
      </a-text>
    </a-entity>

  </a-scene>

</body>
</html>
